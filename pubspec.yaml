name: node_writer
description: A nonlinear, node-based story editor built with Flutter.
publish_to: 'none'
version: 1.7.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.5+1
  # Unique IDs for nodes
  uuid: ^4.5.3
  # System file dialogs (Save As / Open)
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

